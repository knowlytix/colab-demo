name: KAL + GMS README demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kal-gms-readme-demo.yml"
      - "README.md"
      - "pyproject.toml"
      - "knowlytix/**"
      - "knowlytix_demo/**"
      - "notebooks/kal_gms_e2e_demo.ipynb"
  pull_request:
    paths:
      - ".github/workflows/kal-gms-readme-demo.yml"
      - "README.md"
      - "pyproject.toml"
      - "knowlytix/**"
      - "knowlytix_demo/**"
      - "notebooks/kal_gms_e2e_demo.ipynb"

permissions:
  contents: read

concurrency:
  group: kal-gms-readme-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-readme-path:
    name: Install and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the KAL + GMS dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[kal-gms]"

      - name: Build the installable package
        run: python -m build

      - name: Validate notebook code cells
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          path = Path("notebooks/kal_gms_e2e_demo.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          code_cells = [
              "".join(cell["source"])
              for cell in notebook["cells"]
              if cell["cell_type"] == "code"
          ]
          for index, source in enumerate(code_cells):
              compile(
                  source,
                  f"{path}:code-cell-{index}",
                  "exec",
                  flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT,
              )
          print(f"Validated {len(code_cells)} notebook code cells.")
          PY
