; Standalone Alembic configuration for KAL migrations.
;
; Used when the package's migrations are driven directly (rather than
; merged into a host application's Alembic tree). See
; ``knowlytix.kal.migrations.__init__`` for usage.

[alembic]
; ``%(here)s`` resolves to the directory of this config file so the
; documented ``alembic -c knowlytix/kal/migrations/alembic.ini upgrade
; head`` invocation works regardless of cwd (see this module's
; ``__init__.py`` docstring).
script_location = %(here)s
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s
; sqlalchemy.url is not set here; provide it via the KAL_DATABASE_URL
; env var so this file can ship without secrets baked in.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
